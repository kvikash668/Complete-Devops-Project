############ingress.yaml########
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: socialecho-ingress
  namespace: socialecho
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    # FRONTEND CANARY
    alb.ingress.kubernetes.io/actions.frontend: |
      {
        "type": "forward",
        "forwardConfig": {
          "targetGroups": [
            { "serviceName": "frontend", "servicePort": "80", "weight": 90 },
            { "serviceName": "frontend-canary", "servicePort": "80", "weight": 10 }
          ]
        }
      }

    # BACKEND CANARY
    alb.ingress.kubernetes.io/actions.backend: |
      {
        "type": "forward",
        "forwardConfig": {
          "targetGroups": [
            { "serviceName": "backend", "servicePort": "4000", "weight": 90 },
            { "serviceName": "backend-canary", "servicePort": "4000", "weight": 10 }
          ]
        }
      }

spec:
  ingressClassName: alb
  rules:
    - host: www.socialecho.com
      http:
        paths:

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: use-annotation

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: use-annotation

##########mongo-express-server.yaml##########
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  namespace: socialecho
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      # 👇 Node affinity to ensure pods run only on backend-db nodegroup
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: eks.amazonaws.com/nodegroup
                    operator: In
                    values:
                      - db-ng # 👈 your nodegroup name
      containers:
      - name: mongo-express
        image: mongo-express:latest
        env:
        - name: ME_CONFIG_MONGODB_ADMINUSERNAME
          value: admin
        - name: ME_CONFIG_MONGODB_ADMINPASSWORD
          value: admin
        - name: ME_CONFIG_MONGODB_SERVER
          value: mongo
        - name: ME_CONFIG_MONGODB_URL
          value: mongodb://admin:admin@mongo:27017
        - name: ME_CONFIG_SITE_BASEURL
          value: /
        ports:
        - containerPort: 8081
        resources:
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express
  namespace: socialecho
spec:
  selector:
    app: mongo-express
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 32081
  type: NodePort
  
#############mongo-server.yaml##########
# ===============================================
# 1️⃣ StorageClass - Automatic EBS Provisioning
# ===============================================
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-gp3
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp3
  fsType: ext4

---

# ===============================================
# 2️⃣ PersistentVolumeClaim (PVC)
# ===============================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
  namespace: socialecho
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-gp3     # <--- links to StorageClass
  resources:
    requests:
      storage: 5Gi

---

# ===============================================
# 3️⃣ MongoDB Deployment
# ===============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: socialecho
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: db-ng
      containers:
      - name: mongo
        image: mongo:6
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "admin"
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: "admin"
        volumeMounts:
        - name: mongo-storage
          mountPath: /data/db
      volumes:
      - name: mongo-storage
        persistentVolumeClaim:
          claimName: mongo-pvc

---

# ===============================================
# 4️⃣ MongoDB Service
# ===============================================
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: socialecho
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017

