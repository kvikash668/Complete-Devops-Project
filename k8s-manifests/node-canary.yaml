# ===============================================
# Canary Backend Deployment
# ===============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-canary
  namespace: socialecho
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
      version: canary
  template:
    metadata:
      labels:
        app: backend
        version: canary
    spec:
      nodeSelector:
        tier: backend-canary   # FIX: `app=backend` matches ALL backend nodes including
                               # stable ones — use `tier: backend-canary` which only
                               # matches the canary node group exclusively
      tolerations:
      - key: "version"
        operator: "Equal"
        value: "canary"
        effect: "NoSchedule"
      containers:
      - name: backend
        image: kvikash668/backend:15
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4000
        envFrom:               # FIX: was missing — caused CrashLoopBackOff
        - secretRef:
            name: backend-secret
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1024Mi"

---

# ===============================================
# Canary Backend Service
# ===============================================
apiVersion: v1
kind: Service
metadata:
  name: backend-canary
  namespace: socialecho
spec:
  type: ClusterIP              # FIX: was missing type — always be explicit
  selector:
    app: backend
    version: canary
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP            # FIX: added explicit protocol